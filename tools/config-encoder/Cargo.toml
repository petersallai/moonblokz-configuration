[package]
name = "moonblokz-config-encoder"
version = "0.1.0"
edition = "2024"
description = "Host-side encoder for MoonBlokz chain-configuration content — parameter overrides to signed configuration content."
license = "MIT"
repository = "https://github.com/petersallai/moonblokz-configuration"

[lib]
name = "moonblokz_config_encoder"
path = "src/lib.rs"

[[bin]]
name = "config-encoder"
path = "src/main.rs"

[dependencies]
# The tool signs with the scheme the chain runs, so every crate in the graph must
# agree on one. It forwards the scheme like the libraries do (`schnorr` by default,
# `bls-min-sig` / `bls-min-pk` with `default-features = false`), so it can found a
# chain of each scheme (DEC-252); the block-size tier stays the reference one.
moonblokz-configuration = { path = "../..", default-features = false, features = ["block-size-2016"] }
moonblokz-chain-types = { path = "../../../moonblokz-chain-types", default-features = false, features = ["block-size-2016"] }
moonblokz-crypto = { path = "../../../moonblokz-crypto-lib", default-features = false }
moonblokz-vm-asm = { path = "../../../moonblokz-vm/tools/vm-asm", default-features = false }

[features]
default = ["schnorr"]
schnorr = ["moonblokz-configuration/schnorr", "moonblokz-chain-types/schnorr", "moonblokz-crypto/schnorr"]
bls-min-sig = ["moonblokz-configuration/bls-min-sig", "moonblokz-chain-types/bls-min-sig", "moonblokz-crypto/bls-min-sig"]
bls-min-pk = ["moonblokz-configuration/bls-min-pk", "moonblokz-chain-types/bls-min-pk", "moonblokz-crypto/bls-min-pk"]
