[package]
name = "moonblokz-config-encoder"
version = "0.1.0"
edition = "2024"
description = "Host-side encoder for MoonBlokz chain-configuration content — parameter overrides to signed configuration content."
license = "MIT"
repository = "https://github.com/petersallai/moonblokz-configuration"

[lib]
name = "moonblokz_config_encoder"
path = "src/lib.rs"

[[bin]]
name = "config-encoder"
path = "src/main.rs"

[dependencies]
# A host tool is a leaf, so the backend is pinned here rather than forwarded: the
# tool must sign with the same backend the chain runs, and every crate in the
# graph has to agree on one. The encoder founds Schnorr chains until Story 6.17
# adds the BLS schemes; `default-features = false` keeps every crate on that one
# scheme, since enabling two does not build.
moonblokz-configuration = { path = "../..", default-features = false, features = ["schnorr", "block-size-2016"] }
moonblokz-chain-types = { path = "../../../moonblokz-chain-types", default-features = false, features = ["schnorr", "block-size-2016"] }
moonblokz-crypto = { path = "../../../moonblokz-crypto-lib", default-features = false, features = ["schnorr"] }
moonblokz-vm-asm = { path = "../../../moonblokz-vm/tools/vm-asm", default-features = false }
